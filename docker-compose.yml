
services:
  edge-go:
    build:
      context: .
      dockerfile: Dockerfile.edge
    environment:
      # APL Origin Configuration
      - APL_ORIGIN=${APL_ORIGIN}
      
      # Edge Go Runtime Configuration
      - UPSTREAM_TIMEOUT=${UPSTREAM_TIMEOUT:-5s}
      - CACHE_SIZE=${CACHE_SIZE:-2048}
      - CACHE_TTL_PLAYLIST=${CACHE_TTL_PLAYLIST:-2s}
      - CACHE_TTL_SEGMENT=${CACHE_TTL_SEGMENT:-600s}
      - PREFETCH_WORKERS=${PREFETCH_WORKERS:-30}
      - PREFETCH_BATCH=${PREFETCH_BATCH:-50}
      - ENABLE_PREFETCH=${ENABLE_PREFETCH:-true}
      
      # Metrics Configuration
      - METRICS_RESET_DAILY=${METRICS_RESET_DAILY:-true}
      - METRICS_RESET_TIME=${METRICS_RESET_TIME:-06:00}
    volumes:
      - ./cache/go:/app/cache
    ports:
      - "9000:9000"  # Expose metrics endpoint to host
    expose:
      - "9000"
    restart: unless-stopped

  edge-proxy:
    build: .
    container_name: nginx-live
    depends_on:
      - edge-go
    environment:
      - SSL_ENABLE=${SSL_ENABLE:-false}
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./cache/nginx:/var/cache/nginx
    restart: unless-stopped
